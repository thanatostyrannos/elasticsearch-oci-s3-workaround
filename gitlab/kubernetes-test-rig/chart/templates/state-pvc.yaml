{{/*
Shared state between the load generator, the loop and teardown: the
generator's --state-file (which names everything teardown removes) and
--report-file (which the loop's preflight watches for the first expired
snapshot, the same wait root .gitlab-ci.yml's qualify:oci job does inline).
ReadWriteOnce, which is enough on a single-node cluster (this project's own
lab manifests target Rancher Desktop, a single node). On a multi-node cluster,
either use a storage class that supports ReadWriteMany, or keep the
churn-rig and qualify pods on the same node (a nodeSelector or a small
node pool works).
*/}}
{{- if or .Values.churnRig.enabled .Values.qualify.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rig.fullname" . }}-state
  namespace: {{ include "rig.namespace" . }}
  labels:
    {{- include "rig.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- end }}
