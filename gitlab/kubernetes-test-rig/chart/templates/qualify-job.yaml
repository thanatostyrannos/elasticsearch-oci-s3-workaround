{{/*
python3 reclaim_test_protocol.py: audits, dry runs, and (only when
qualify.dryRunOnly is false) executes against the digest that dry run
printed, cycle after cycle. Manual only: this template is a plain Job, and
gitlab/kubernetes-test-rig/.gitlab-ci.yml refuses to trigger it from a
schedule for the same reason the CI variant does. Nothing here decides to
delete on its own; generation_chain.reclaim's own approval-digest handshake
still gates every cycle's execute step.
*/}}
{{- if .Values.qualify.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rig.fullname" . }}-qualify
  namespace: {{ include "rig.namespace" . }}
  annotations:
    "argocd.argoproj.io/sync-wave": "2"
  labels:
    {{- include "rig.labels" . | nindent 4 }}
    app: {{ include "rig.fullname" . }}-qualify
    rig-component: qualify
spec:
  backoffLimit: {{ .Values.qualify.backoffLimit | int64 }}
  # int64: a bare large integer from values.yaml decodes as float64 and Go's
  # default float formatting would otherwise render it in scientific
  # notation, which is not valid here.
  activeDeadlineSeconds: {{ .Values.qualify.activeDeadlineSeconds | int64 }}
  template:
    metadata:
      labels:
        app: {{ include "rig.fullname" . }}-qualify
    spec:
      restartPolicy: Never
      # This job talks to Elasticsearch and S3/OCI, never the Kubernetes
      # API, so it does not need a service account token mounted.
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: {{ .Values.securityContext.runAsUser | int64 }}
        runAsGroup: {{ .Values.securityContext.runAsGroup | int64 }}
        fsGroup: {{ .Values.securityContext.fsGroup | int64 }}
      initContainers:
        {{- include "rig.sourceInitContainers" . | nindent 8 }}
        {{- include "rig.credentialStagingInit" (dict "root" . "keys" (list .Values.credentials.keys.credentialsJson .Values.credentials.keys.esPassword)) | nindent 8 }}
        {{- include "rig.waitForElasticsearch" . | nindent 8 }}
      containers:
        - name: qualify
          image: {{ .Values.image.python | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: {{ include "rig.workdir" . }}
          securityContext:
            {{- include "rig.securityContext" . | nindent 12 }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: Q_OUT_PATH
              value: {{ .Values.qualify.outPath | quote }}
            - name: Q_REPORT_FILE
              value: {{ .Values.churnRig.reportFilePath | quote }}
            - name: Q_CYCLES
              value: {{ .Values.qualify.cycles | int64 | quote }}
            - name: Q_START
              value: {{ .Values.qualify.start | int64 | quote }}
            - name: Q_MODE
              value: {{ .Values.qualify.mode | quote }}
            - name: Q_MIN_DOCS
              value: {{ .Values.qualify.minDocsPerShard | int64 | quote }}
            - name: Q_SETTLE_TIMEOUT
              value: {{ .Values.qualify.settleTimeout | int64 | quote }}
            - name: Q_FRESH_SNAPSHOTS
              value: {{ .Values.qualify.freshSnapshots | int64 | quote }}
            - name: Q_SLEEP
              value: {{ .Values.qualify.sleep | int64 | quote }}
            - name: Q_TRANSPORT
              value: {{ .Values.qualify.transport | quote }}
            - name: Q_ENDPOINT
              value: {{ .Values.qualify.endpoint | quote }}
            - name: Q_REGION
              value: {{ .Values.qualify.region | quote }}
            - name: Q_BUCKET
              value: {{ .Values.qualify.bucket | quote }}
            - name: Q_PREFIX
              value: {{ .Values.qualify.prefix | quote }}
            - name: Q_CREDENTIALS
              value: {{ printf "/secrets/%s" .Values.credentials.keys.credentialsJson | quote }}
            - name: Q_REPOSITORY
              value: {{ .Values.qualify.repository | quote }}
            - name: Q_DATA_STREAM
              value: {{ .Values.qualify.dataStream | quote }}
            {{- if .Values.qualify.settlePoll }}
            - name: Q_SETTLE_POLL
              value: {{ .Values.qualify.settlePoll | quote }}
            {{- end }}
            {{- if .Values.qualify.ociNamespace }}
            - name: Q_OCI_NAMESPACE
              value: {{ .Values.qualify.ociNamespace | quote }}
            {{- end }}
            {{- if .Values.qualify.timeout }}
            - name: Q_TIMEOUT
              value: {{ .Values.qualify.timeout | quote }}
            {{- end }}
            {{- if .Values.qualify.askElasticsearch }}
            - name: Q_ES_URL
              value: {{ include "rig.esUrl" . | quote }}
            - name: Q_ES_USER
              value: {{ .Values.credentials.harnessEsUser | quote }}
            - name: Q_ES_PASSWORD_FILE
              value: {{ printf "/secrets/%s" .Values.credentials.keys.esPassword | quote }}
            {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p "$(dirname "$Q_OUT_PATH")"
              {{- if .Values.churnRig.enabled }}
              echo "waiting for the load generator's first snapshot to expire"
              i=0
              while [ "$i" -lt 60 ]; do
                if [ -f "$Q_REPORT_FILE" ] && grep -q first_snapshot_expired "$Q_REPORT_FILE"; then
                  echo "  a snapshot has expired: objects are now being stranded"
                  break
                fi
                i=$((i + 1))
                sleep 30
              done
              if [ -f "$Q_REPORT_FILE" ] && ! grep -q first_snapshot_expired "$Q_REPORT_FILE"; then
                echo "no snapshot expired in 30 minutes; the loop will still run, but expect it to find nothing yet" >&2
              fi
              {{- else }}
              echo "churnRig.enabled is false: running the loop against a pre-existing repository, no wait"
              {{- end }}
              # int64 on every bare number here: values.yaml decodes a large
              # integer as float64, and Go's default float formatting renders
              # it in scientific notation (e.g. "1e+05"), which this tool's
              # argparse int() refuses.
              set -- --cycles "$Q_CYCLES" --start "$Q_START" --mode "$Q_MODE"
              set -- "$@" --min-docs-per-shard "$Q_MIN_DOCS"
              set -- "$@" --settle-timeout "$Q_SETTLE_TIMEOUT"
              set -- "$@" --fresh-snapshots "$Q_FRESH_SNAPSHOTS"
              {{- if .Values.qualify.settlePoll }}
              set -- "$@" --settle-poll "$Q_SETTLE_POLL"
              {{- end }}
              set -- "$@" --sleep "$Q_SLEEP"
              set -- "$@" --transport "$Q_TRANSPORT"
              set -- "$@" --endpoint "$Q_ENDPOINT" --region "$Q_REGION"
              {{- if .Values.qualify.insecureHttp }}
              set -- "$@" --insecure-http
              {{- end }}
              {{- if .Values.qualify.ociNamespace }}
              set -- "$@" --namespace "$Q_OCI_NAMESPACE"
              {{- end }}
              set -- "$@" --bucket "$Q_BUCKET" --prefix "$Q_PREFIX"
              set -- "$@" --credentials "$Q_CREDENTIALS"
              {{- if .Values.qualify.askElasticsearch }}
              set -- "$@" --elasticsearch "$Q_ES_URL"
              set -- "$@" --es-user "$Q_ES_USER"
              set -- "$@" --es-password-file "$Q_ES_PASSWORD_FILE"
              {{- if include "rig.hasEsCa" . }}
              set -- "$@" --es-ca-cert /es-ca-cert/ca.crt
              {{- end }}
              {{- end }}
              set -- "$@" --repository "$Q_REPOSITORY"
              set -- "$@" --data-stream "$Q_DATA_STREAM"
              set -- "$@" --out "$Q_OUT_PATH"
              {{- if .Values.qualify.timeout }}
              set -- "$@" --timeout "$Q_TIMEOUT"
              {{- end }}
              {{- if .Values.qualify.dryRunOnly }}
              set -- "$@" --dry-run-only
              echo "DRY RUN ONLY. Nothing will be deleted. qualify.dryRunOnly is true."
              {{- else }}
              echo "DELETES ARE ENABLED for this run (qualify.dryRunOnly is false)."
              {{- end }}
              echo "starting: python3 reclaim_test_protocol.py $*"
              # A failing protocol must still reach the report below, so errexit is off for this one command.
              status=0
              python3 reclaim_test_protocol.py "$@" || status=$?
              echo "done, exit $status"
              echo "totals, read from the per-cycle execute files rather than the summary:"
              if ls "$Q_OUT_PATH"/exec-*.txt >/dev/null 2>&1; then
                awk '/^deleted:/{d+=$2} /^failed:/{f+=$2} /^unconfirmed:/{u+=$2}
                     END {printf "    deleted=%d failed=%d unconfirmed=%d\n", d, f, u}' \
                    "$Q_OUT_PATH"/exec-*.txt
              else
                echo "    no execute files: nothing was deleted"
              fi
              exit "$status"
          resources:
            {{- toYaml .Values.qualify.resources | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: state
              mountPath: /state
            - name: credentials
              mountPath: /secrets
              readOnly: true
            {{- if include "rig.hasEsCa" . }}
            {{- include "rig.esCaMount" . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "rig.sourceVolumes" . | nindent 8 }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "rig.fullname" . }}-state
        {{- include "rig.credentialVolumes" (dict "root" . "keys" (list .Values.credentials.keys.credentialsJson .Values.credentials.keys.esPassword)) | nindent 8 }}
        {{- if include "rig.hasEsCa" . }}
        {{- include "rig.esCaVolume" . | nindent 8 }}
        {{- end }}
{{- end }}
