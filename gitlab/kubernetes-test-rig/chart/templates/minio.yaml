{{/*
Templated from this project's lab manifest for MinIO. Pinned to
RELEASE.2025-01-18T00-31-37Z on purpose: it is the last MinIO release that
rejects an S3 DeleteObjects request carrying only x-amz-checksum-crc32 with
no Content-MD5, which is the same behavior as OCI Object Storage's S3-compat
API. The next release accepts the request and the fault this rig exists to
reproduce disappears with it. Do not bump minio.image casually.
*/}}
{{- if .Values.minio.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rig.fullname" . }}-minio-data
  namespace: {{ include "rig.namespace" . }}
  labels:
    {{- include "rig.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.minio.storageClassName }}
  storageClassName: {{ .Values.minio.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.storageSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rig.fullname" . }}-minio
  namespace: {{ include "rig.namespace" . }}
  labels:
    {{- include "rig.labels" . | nindent 4 }}
    app: {{ include "rig.fullname" . }}-minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "rig.fullname" . }}-minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: {{ include "rig.fullname" . }}-minio
    spec:
      # The minio/minio image runs as root by default (no non-root user
      # baked in), so this pins it to a fixed non-root uid/gid instead.
      # fsGroup chowns the data PVC's group ownership so uid 1000 can write
      # to it; without it MinIO authenticates its own startup and then dies
      # unable to write its erasure-coding metadata.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "rig.fullname" . }}-minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rig.fullname" . }}-minio-credentials
                  key: root-password
          securityContext:
            {{- include "rig.securityContext" . | nindent 12 }}
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            # MinIO's Go runtime uses the OS temp dir for scratch files
            # outside the erasure-coded backend; with the root filesystem
            # read-only, that needs its own writable mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rig.fullname" . }}-minio-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rig.fullname" . }}-minio
  namespace: {{ include "rig.namespace" . }}
  labels:
    {{- include "rig.labels" . | nindent 4 }}
    app: {{ include "rig.fullname" . }}-minio
spec:
  type: ClusterIP
  selector:
    app: {{ include "rig.fullname" . }}-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rig.fullname" . }}-minio-credentials
  namespace: {{ include "rig.namespace" . }}
  labels:
    {{- include "rig.labels" . | nindent 4 }}
type: Opaque
stringData:
  root-user: {{ .Values.minio.rootUser | quote }}
  root-password: {{ .Values.minio.rootPassword | quote }}
{{- end }}
