{{/* Templated from this project's lab manifest for the MinIO bucket job. */}}
{{- if .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "rig.fullname" . }}-minio-make-bucket
  namespace: {{ include "rig.namespace" . }}
  labels:
    {{- include "rig.labels" . | nindent 4 }}
  annotations:
    # NOT a post-install hook. Argo maps post-install to PostSync, which only
    # runs once the sync reports Healthy, and the sync cannot become healthy
    # while the rig jobs are failing for want of the bucket this job creates.
    # Each waits for the other and the install never completes.
    #
    # An ordinary resource in an earlier sync wave has neither problem, and
    # the wait below covers a plain `helm install`, where waves do not apply.
    "argocd.argoproj.io/sync-wave": "1"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: {{ include "rig.fullname" . }}-minio-make-bucket
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        - name: wait-for-minio
          image: {{ .Values.image.python | quote }}
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            {{- include "rig.securityContext" . | nindent 12 }}
          command:
            - python3
            - -c
            - |
              import time, urllib.request, urllib.error
              url = "http://{{ include "rig.fullname" . }}-minio.{{ include "rig.namespace" . }}.svc:9000/minio/health/live"
              deadline = time.time() + 300
              while time.time() < deadline:
                  try:
                      urllib.request.urlopen(url, timeout=5)
                      print("minio is answering"); raise SystemExit(0)
                  except urllib.error.HTTPError:
                      print("minio is answering"); raise SystemExit(0)
                  except Exception:
                      time.sleep(5)
              raise SystemExit("minio did not answer within 300s")
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-01-17T23-25-50Z
          command:
            - /bin/sh
            - -c
            - >
              mc alias set rig http://{{ include "rig.fullname" . }}-minio:9000
              "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb -p rig/{{ .Values.minio.bucket }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "rig.fullname" . }}-minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "rig.fullname" . }}-minio-credentials
                  key: root-password
            # minio/mc runs as root by default and writes its alias config to
            # $HOME/.mc; point it at the emptyDir below instead of relaxing
            # readOnlyRootFilesystem.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
