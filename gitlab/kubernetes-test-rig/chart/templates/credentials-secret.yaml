{{- if not .Values.credentials.existingSecret }}
{{- $esSection := dict }}
{{- if eq .Values.credentials.elasticsearch.authMethod "apiKey" }}
{{- $esSection = dict "api_key" .Values.credentials.elasticsearch.apiKey }}
{{- else }}
{{- $esSection = dict "username" .Values.credentials.elasticsearch.username "password" .Values.credentials.elasticsearch.password }}
{{- end }}
{{- $credsDoc := dict "s3" (dict "access_key_id" .Values.credentials.s3.accessKeyId "secret_access_key" .Values.credentials.s3.secretAccessKey) "elasticsearch" $esSection }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rig.credentialsSecretName" . }}
  namespace: {{ include "rig.namespace" . }}
  labels:
    {{- include "rig.labels" . | nindent 4 }}
type: Opaque
stringData:
  # generation_chain.credentials.CredentialFile's format: an "s3" section for
  # the s3 and oci transports, an "elasticsearch" section read only when
  # --elasticsearch / --es-repository is passed. Mounted with defaultMode
  # 0600 below, which is what CredentialFile.require_private demands; there
  # is nothing else to chmod in Kubernetes the way GitLab's File-type
  # variables need.
  {{ .Values.credentials.keys.credentialsJson }}: {{ $credsDoc | toJson | quote }}
  # The load generator's own --s3-secret-key-file, for its optional bucket
  # listing (object-count, generation-count and leak fields in reports). Same
  # secret value as credentials.s3.secretAccessKey above; kept as its own key
  # because that flag takes a file holding only the secret, not a JSON
  # document.
  {{ .Values.credentials.keys.s3SecretAccessKey }}: {{ .Values.credentials.s3.secretAccessKey | quote }}
  # The harness's OWN Elasticsearch login (ILM/SLM policy setup, the
  # segment-mode shard wait): snapshot_churn_rig.py and
  # reclaim_test_protocol.py's --password-file / --es-password-file. This is
  # NOT the same credential as the "elasticsearch" section above; see
  # values.yaml's comment on credentials.harnessEsPassword for why the two
  # are kept separate.
  {{ .Values.credentials.keys.esPassword }}: {{ .Values.credentials.harnessEsPassword | quote }}
{{- end }}
