# Deploys the qualification rig via Helm, waits for the loop to finish, and
# tears down. Manual only. This pipeline is never scheduled: the delete path
# lives inside the rig it deploys, and the safety property the whole
# read-only/test-rig split depends on is that the thing on a timer cannot
# delete anything. If you want a schedule, use gitlab/readonly-scan instead.
#
# EVERY option every tool in the rig accepts is already a value in
# ../kubernetes-test-rig/chart/values.yaml, grouped by tool. This pipeline
# does not re-list them as CI/CD variables: that would just be values.yaml
# copied into a second format that can drift from the first. Instead it
# takes a values override file (VALUES_FILE, committed to your repo, no
# secrets in it) and a secrets override file (SECRETS_VALUES_FILE, a
# File-type CI/CD variable, never committed). Point VALUES_FILE at a copy of
# values.yaml with only the keys you want to change.

stages:
  - deploy
  - qualify
  - teardown

default:
  image: alpine/k8s:1.30.9   # kubectl + helm, one image, matches most clusters
                             # in support today; bump if your cluster is newer
  before_script:
    - kubectl version --client
    - helm version

variables:
  KUBE_NAMESPACE: "es-rig"
  HELM_RELEASE: "rig"
  CHART_PATH: "gitlab/kubernetes-test-rig/chart"
  # A values file committed in your repository (or generated by an earlier
  # job), holding only the keys you want to change from the chart's
  # defaults. No secrets belong in here; use SECRETS_VALUES_FILE for those.
  # Empty runs the chart with its published defaults, which point at
  # placeholder endpoints and will refuse to do anything useful.
  VALUES_FILE: ""
  # How long to wait for the qualify Job to finish. Match this to
  # qualify.cycles and qualify.sleep in your values override: the published
  # 50-cycle run took under six hours, so 6h30m gives it room without
  # holding a runner forever on a stuck cluster.
  QUALIFY_WAIT: "6h30m"
  # helm upgrade --install's own readiness wait, for Deployments this chart
  # creates directly (MinIO, if minio.enabled). Deliberately NOT
  # --wait-for-jobs: the churn-rig and qualify Jobs run for hours, and
  # making `helm install` block on them would just move the wait to a place
  # with a much shorter default CI job timeout.
  DEPLOY_WAIT: "10m"

# SECRETS_VALUES_FILE is a File-type CI/CD variable: a YAML document read
# with `helm ... -f`, holding this rig's actual credentials
# (credentials.s3.*, credentials.elasticsearch.*, credentials.harnessEs*,
# and minio.rootUser/rootPassword if you use minio.enabled). GitLab writes
# it to a path and hands the job that path, never the content in a log or
# in `ps`. Nothing here needs an `install -m 600` step the way the raw
# credential files in gitlab/readonly-scan do: this file's content only
# ever becomes a Kubernetes Secret, created with the mode Kubernetes itself
# controls (defaultMode 0600 on the volume the chart mounts it through).
.values_args: &values_args
  - |
    values_args=""
    if [ -n "${VALUES_FILE:-}" ]; then values_args="$values_args -f $VALUES_FILE"; fi
    if [ -n "${SECRETS_VALUES_FILE:-}" ]; then values_args="$values_args -f $SECRETS_VALUES_FILE"; fi

# ---------------------------------------------------------------------------
# Deploy. Kicks off the load generator and the loop: both run as Kubernetes
# Jobs created directly by the chart install, so this step does not block
# on them finishing.
# ---------------------------------------------------------------------------

deploy:rig:
  stage: deploy
  script:
    - *values_args
    - |
      helm upgrade --install "$HELM_RELEASE" "$CHART_PATH" \
        --namespace "$KUBE_NAMESPACE" --create-namespace \
        --wait --timeout "$DEPLOY_WAIT" \
        $values_args
    - kubectl -n "$KUBE_NAMESPACE" get pods -l app.kubernetes.io/instance="$HELM_RELEASE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: manual

# ---------------------------------------------------------------------------
# Wait for the loop, and read its exit status. The load generator has no
# defined end from this job's point of view; it stops mattering once the
# loop it feeds has finished the cycles it was asked for.
# ---------------------------------------------------------------------------

qualify:wait:
  stage: qualify
  needs: ["deploy:rig"]
  timeout: 7h
  script:
    - |
      # Found by label, not by predicting the chart's generated name: the
      # chart's own object names depend on nameOverride and the release
      # name, and a label selector stays correct if either changes.
      job_name=$(kubectl -n "$KUBE_NAMESPACE" get job \
        -l "app.kubernetes.io/instance=${HELM_RELEASE},rig-component=qualify" \
        -o jsonpath='{.items[0].metadata.name}')
      [ -n "$job_name" ] || { echo "no qualify Job found for release $HELM_RELEASE"; exit 1; }
      echo "waiting up to $QUALIFY_WAIT for job/$job_name"
      if kubectl -n "$KUBE_NAMESPACE" wait --for=condition=complete \
           "job/$job_name" --timeout "$QUALIFY_WAIT"; then
        status=0
      else
        # `wait --for=condition=complete` also returns non-zero on a Job
        # that reached condition=failed, which is a real outcome worth
        # logs for, not just a wait that timed out.
        status=1
      fi
      kubectl -n "$KUBE_NAMESPACE" logs "job/$job_name" --tail=-1 | tee qualify.log
      failed=$(kubectl -n "$KUBE_NAMESPACE" get "job/$job_name" \
                 -o jsonpath='{.status.failed}' 2>/dev/null || true)
      [ -z "$failed" ] || [ "$failed" = "0" ] || status=1
      exit "$status"
  artifacts:
    name: "qualify-$CI_PIPELINE_ID"
    when: always
    paths:
      - qualify.log
    expire_in: 90 days
  # Teardown has to run whether this step passed, failed, or the runner
  # never got this far, so it is a separate job in its own stage below
  # rather than an after_script here: after_script would not run if the
  # deploy step itself failed before this stage started.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: manual

# ---------------------------------------------------------------------------
# Teardown. Runs the rig's own pre-delete Helm hook
# (snapshot_churn_rig.py teardown), which is what actually knows the names
# this rig created. `after_script` on THIS job covers the case where
# `helm uninstall` itself times out or the runner is killed mid-command;
# RUNNER_AFTER_SCRIPT_TIMEOUT gives it room, because GitLab kills
# after_script early by default and teardown talks to a cluster and a
# bucket. teardown:manual below is the safety net for everything else: a
# runner that died before reaching this stage at all.
# ---------------------------------------------------------------------------

teardown:rig:
  stage: teardown
  # No `needs:` here on purpose. `needs` starts a job as soon as the jobs it
  # names finish, skipping the rest of the normal stage order, and this job
  # must not start tearing down infrastructure the qualify stage might
  # still be using. Ordinary stage order (wait for every job in the
  # `qualify` stage, pass or fail) is what makes `rules: when: always` below
  # mean "after qualify is truly done," not "as soon as deploy is done."
  variables:
    RUNNER_AFTER_SCRIPT_TIMEOUT: 10m
  script:
    - helm uninstall "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE" --wait --timeout 15m
  after_script:
    - |
      if helm status "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE" >/dev/null 2>&1; then
        echo "helm uninstall did not finish; retrying teardown directly"
        template_job=$(kubectl -n "$KUBE_NAMESPACE" get job \
          -l "app.kubernetes.io/instance=${HELM_RELEASE},rig-component=teardown-manual" \
          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        if [ -n "$template_job" ]; then
          kubectl -n "$KUBE_NAMESPACE" create job \
            --from="job/${template_job}" "teardown-retry-${CI_JOB_ID}" || true
        fi
        echo "run the teardown:manual job in this pipeline if that did not work either"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always

# Safety net: the rig's state lives inside Elasticsearch and in the bucket,
# nowhere a CI runner's own cleanup reaches once it is gone. A load
# generator that outlives its job keeps ingesting and keeps leaking, so run
# this by hand if teardown:rig did not complete.
teardown:manual:
  stage: teardown
  script:
    - |
      helm uninstall "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE" --wait --timeout 15m || true
      kubectl -n "$KUBE_NAMESPACE" create job \
        --from="job/${HELM_RELEASE}-elasticsearch-oci-s3-workaround-test-rig-teardown-manual" \
        "teardown-manual-${CI_JOB_ID}"
      kubectl -n "$KUBE_NAMESPACE" wait --for=condition=complete \
        "job/teardown-manual-${CI_JOB_ID}" --timeout 15m
      kubectl -n "$KUBE_NAMESPACE" logs "job/teardown-manual-${CI_JOB_ID}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: manual
