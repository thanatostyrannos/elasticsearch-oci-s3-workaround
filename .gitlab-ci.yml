# What this repository does when GitLab runs it: a read-only audit, and
# nothing else.
#
# GitLab picks this file up automatically, so it decides what someone gets by
# importing this project and pressing the button. That has to be the safe
# thing. The audit reads a snapshot repository and reports which objects a
# failed delete stranded there. It cannot delete: its HTTP transport permits
# GET and HEAD and nothing else, and refuses any other method rather than
# trusting a caller to behave.
#
# The full qualification rig, which mutates a cluster for hours and deletes
# objects when told to, is deliberately NOT here. It lives in
# gitlab/kubernetes-test-rig/, is manual only, and refuses to run from a
# schedule. Keeping it out of the file GitLab runs by default means nobody
# reaches it by accident.
#
# Everything this pipeline needs comes from project CI/CD variables. Nothing
# is defaulted, because a default that resolves would point the run at a
# bucket nobody chose. The job refuses and names what is missing.
#
#   Settings, CI/CD, Variables:
#
#     CREDS_JSON            File   the JSON credentials file, s3 section plus
#                                  an elasticsearch section if you set
#                                  GENCHAIN_ELASTICSEARCH
#     GENCHAIN_ENDPOINT     Var    https://<namespace>.compat.objectstorage.<region>.oraclecloud.com
#     GENCHAIN_REGION       Var    us-ashburn-1, or wherever the bucket is
#     GENCHAIN_BUCKET       Var    the bucket holding the repository
#     GENCHAIN_PREFIX       Var    the repository's base_path, trailing slash
#
#   Optional, and worth setting: GENCHAIN_ELASTICSEARCH with
#   GENCHAIN_ES_REPOSITORY, so the audit can also ask the cluster what a
#   mounted searchable snapshot is protecting. Without them the report cannot
#   see mounts; it does not pretend they are absent.
#
# Mark CREDS_JSON Masked and Protected. It is a File variable so the job gets
# a path rather than a value: a secret in an argument is visible in `ps` to
# every other user on the runner.
#
# The definition itself lives in gitlab/readonly-scan/ so there is one copy of
# it rather than two that drift apart.

include:
  - local: gitlab/readonly-scan/.gitlab-ci.yml
