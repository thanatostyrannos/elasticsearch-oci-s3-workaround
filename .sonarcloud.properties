# Configuration for SonarQube Cloud Automatic Analysis.
#
# This is the file Automatic Analysis reads. It is NOT sonar-project.properties,
# and it is not the arguments in .github/workflows/sonarcloud.yml: those belong
# to the CI scanner, which cannot run at the same time as Automatic Analysis.
# If a setting here disagrees with the one in the web interface, this file wins.

# Answers "analyzed as compatible with all Python 3 versions by default".
# 3.9 is the tested floor, so anything newer would be advice this project
# cannot take.
sonar.python.version=3.9

sonar.sourceEncoding=UTF-8

# Answers "files that look like test code but 'sonar.tests' is not configured".
# Declaring these as tests also stops the credential fixtures inside them being
# reported as committed secrets: they are planted on purpose, and
# tests/test_no_credentials_committed.py is what guards the real thing.
sonar.tests=tests

# Answers "problems with file encoding in the source code". These three are the
# only tracked files that are not valid UTF-8, and all three are binary on
# purpose: two captured repository tarballs and one raw shard generation
# document, kept so the parser is tested against bytes a real Elasticsearch
# wrote rather than bytes we made up.
sonar.exclusions=\
  tests/fixtures/**,\
  evidence/**,\
  docs/**,\
  **/*.tar.gz,\
  **/*.bin,\
  **/*.zip

# evidence/ is excluded above for a different reason than the binaries. It is
# the captured output of research runs that already happened. Editing it to
# satisfy a rule would falsify the record, so its findings would never be
# actioned and would sit in the queue forever.
