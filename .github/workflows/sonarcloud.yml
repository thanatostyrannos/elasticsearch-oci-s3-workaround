# This workflow uses actions that are not certified by GitHub. They are
# provided by a third party and are governed by separate terms of service,
# privacy policy, and support documentation.

# SonarQube Cloud analysis. The project key and organization are public
# identifiers, not secrets, so they are literals in the args below. One thing
# is needed that cannot be committed:
#
#   SONAR_TOKEN   repository secret. SonarQube Cloud > avatar > My account >
#                 Security, https://sonarcloud.io/account/security/
#
# Until it is set the analysis step is skipped and the job reports green, so a
# red check on this workflow means the analysis itself failed rather than that
# nobody has signed up yet.
name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read       # for actions/checkout
  pull-requests: read  # lets SonarCloud decorate pull requests with results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    # Read once here so the gate below can test them. A secret is empty when
    # it has never been set, which is what makes this check possible at all:
    # the secrets context is not available to a job-level `if`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Decide whether SonarCloud is configured
        id: gate
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not set, so there is nothing to authenticate with. Skipping the analysis. Set it under Settings > Secrets and variables > Actions > Secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The original of this file had no checkout step at all, so even with a
      # token the scanner would have read an empty workspace.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          # Sonar wants history to attribute a line to the commit that wrote
          # it. Without this it sees one commit and blames everything on it.
          fetch-depth: 0

      - name: Analyze with SonarCloud
        if: steps.gate.outputs.ready == 'true'
        # sonarcloud-github-action is archived and deprecated. This is its
        # named replacement, v8.2.1, pinned by commit.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # tests/ is declared as tests rather than sources so its synthetic
          # credential fixtures are not reported as committed secrets: they
          # are planted on purpose, and tests/test_no_credentials_committed.py
          # is what guards the real thing. evidence/ and docs/ are left out
          # because they are captured output and prose, not code.
          args: >
            -Dsonar.projectKey=thanatostyrannos_elasticsearch-oci-s3-workaround
            -Dsonar.organization=thanatostyrannos
            -Dsonar.projectName=elasticsearch-oci-s3-workaround
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.python.version=3.9
            -Dsonar.sources=generation_chain,package.py,reclaim_test_protocol.py,verify_restorable.py,snapshot_sizes.py,snapshot_churn_rig.py
            -Dsonar.tests=tests
          projectBaseDir: .
