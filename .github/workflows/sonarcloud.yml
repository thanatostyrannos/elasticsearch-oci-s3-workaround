# This workflow uses actions that are not certified by GitHub. They are
# provided by a third party and are governed by separate terms of service,
# privacy policy, and support documentation.

# SonarQube Cloud analysis. The project key and organization are public
# identifiers, not secrets, so they are literals in the args below. One thing
# is needed that cannot be committed:
#
#   SONAR_TOKEN   repository secret. SonarQube Cloud > avatar > My account >
#                 Security, https://sonarcloud.io/account/security/
#
# Until it is set the analysis step is skipped and the job reports green, so a
# red check on this workflow means the analysis itself failed rather than that
# nobody has signed up yet.
name: SonarCloud analysis

# Manual only. Automatic Analysis is the analysis method for this project, and
# SonarQube Cloud refuses a CI analysis while it is enabled: the scanner exits 3
# and the job goes red. This workflow stays here, correct and ready, so the
# switch back is turning Automatic Analysis off and restoring the push and
# pull_request triggers below. Nothing else about it needs to change.
on:
  workflow_dispatch:

permissions:
  contents: read       # for actions/checkout
  pull-requests: read  # lets SonarCloud decorate pull requests with results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    # Read once here so the gate below can test them. A secret is empty when
    # it has never been set, which is what makes this check possible at all:
    # the secrets context is not available to a job-level `if`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Decide whether SonarCloud is configured
        id: gate
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SONAR_TOKEN is not set, so there is nothing to authenticate with. Skipping the analysis. Set it under Settings > Secrets and variables > Actions > Secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # The original of this file had no checkout step at all, so even with a
      # token the scanner would have read an empty workspace.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          # Sonar wants history to attribute a line to the commit that wrote
          # it. Without this it sees one commit and blames everything on it.
          fetch-depth: 0

      - name: Analyze with SonarCloud
        if: steps.gate.outputs.ready == 'true'
        # sonarcloud-github-action is archived and deprecated. This is its
        # named replacement, v8.2.1, pinned by commit.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # The Helm chart, the manifests, the workflows and the shell are in
          # scope: they are maintained code and their findings are real.
          #
          # evidence/ is not. It is the captured output of research runs that
          # have already happened, and editing it to satisfy a linter would
          # falsify the record. docs/ is prose.
          #
          # tests/ is declared as tests rather than sources so its credential
          # fixtures are not reported as committed secrets: they are planted
          # on purpose, and tests/test_no_credentials_committed.py is what
          # guards the real thing.
          args: >
            -Dsonar.projectKey=thanatostyrannos_elasticsearch-oci-s3-workaround
            -Dsonar.organization=thanatostyrannos
            -Dsonar.projectName=elasticsearch-oci-s3-workaround
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.python.version=3.9
            -Dsonar.sources=generation_chain,package.py,reclaim_test_protocol.py,verify_restorable.py,snapshot_sizes.py,snapshot_churn_rig.py,scripts,manifests,gitlab,.github,experiment
            -Dsonar.tests=tests
            -Dsonar.qualitygate.wait=true
          projectBaseDir: .

      # The scanner writes the analysis it just submitted here. Reading the
      # task id from the file it produced is what ties the export below to
      # this run rather than to whatever happened to be newest.
      - name: Export the findings this analysis produced
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mkdir -p sonar-export
          key=thanatostyrannos_elasticsearch-oci-s3-workaround
          curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=$key&ps=500&resolved=false" \
            -o sonar-export/issues.json
          curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/measures/component?component=$key&metricKeys=bugs,vulnerabilities,code_smells,security_hotspots,ncloc,duplicated_lines_density,new_violations" \
            -o sonar-export/measures.json
          # Named by commit, because that is what you look it up by. The
          # content hash goes in a sidecar so the file can still be proved
          # unaltered, which is how the release archive is handled too.
          for f in issues measures; do
            sha256sum "sonar-export/$f.json" > "sonar-export/$f.json.sha256"
          done
          python3 -c "import json;print('unresolved issues:', json.load(open('sonar-export/issues.json'))['total'])"

      - name: Keep the export with the run
        if: always() && steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sonar-findings-${{ github.sha }}
          path: sonar-export/
          retention-days: 90
