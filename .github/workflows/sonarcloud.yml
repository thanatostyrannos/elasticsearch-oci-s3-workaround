# This workflow uses actions that are not certified by GitHub. They are
# provided by a third party and are governed by separate terms of service,
# privacy policy, and support documentation.

# SonarCloud analysis, which runs only once this repository has been told how
# to reach a SonarCloud project. Three things are needed, none of which can
# live in this file:
#
#   SONAR_TOKEN         repository secret. SonarQube Cloud > avatar >
#                       My account > Security, https://sonarcloud.io/account/security/
#   SONAR_PROJECT_KEY   repository variable. The project's Information panel
#   SONAR_ORGANIZATION  repository variable. Same panel
#
# Until all three are set the analysis step is skipped and the job reports
# green, so a red check on this workflow means the analysis itself failed
# rather than that nobody has signed up yet. The first step prints exactly
# which of the three is missing.
name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read       # for actions/checkout
  pull-requests: read  # lets SonarCloud decorate pull requests with results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    # Read once here so the gate below can test them. A secret is empty when
    # it has never been set, which is what makes this check possible at all:
    # the secrets context is not available to a job-level `if`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Decide whether SonarCloud is configured
        id: gate
        run: |
          missing=""
          [ -n "$SONAR_TOKEN" ]        || missing="$missing SONAR_TOKEN(secret)"
          [ -n "$SONAR_PROJECT_KEY" ]  || missing="$missing SONAR_PROJECT_KEY(variable)"
          [ -n "$SONAR_ORGANIZATION" ] || missing="$missing SONAR_ORGANIZATION(variable)"
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarCloud is not configured; missing:$missing. Skipping the analysis."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "analysing $SONAR_ORGANIZATION/$SONAR_PROJECT_KEY"
          fi

      # The original of this file had no checkout step at all, so even with a
      # token the scanner would have read an empty workspace.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          # Sonar wants history to attribute a line to the commit that wrote
          # it. Without this it sees one commit and blames everything on it.
          fetch-depth: 0

      - name: Analyze with SonarCloud
        if: steps.gate.outputs.ready == 'true'
        # sonarcloud-github-action is archived and deprecated. This is its
        # named replacement, v8.2.1, pinned by commit.
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.sources=generation_chain,package.py,reclaim_test_protocol.py,verify_restorable.py,snapshot_sizes.py,snapshot_churn_rig.py
            -Dsonar.tests=tests
          projectBaseDir: .
