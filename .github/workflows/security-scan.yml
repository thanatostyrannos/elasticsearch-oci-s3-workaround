# Static analysis of THE RELEASE, not of the repository.
#
# The distinction is the point. Every credential-shaped string a scanner finds
# in this repository lives under tests/, and tests/ does not ship. Scanning the
# working tree produces a report about a tree nobody receives, full of findings
# in fixtures nobody runs. So the package is built first and the scanners are
# pointed at what it actually contains.
name: security scan

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # The suite is the gate. A release built from a red tree is not a
      # release. Standard library only, no network, so nothing to install.
      - name: Run the test suite
        run: python3 -m unittest discover -s tests -q

      - name: Build the release archive
        run: python3 package.py --out dist --version "${GITHUB_SHA::12}"

      - name: Unpack it for scanning
        run: |
          mkdir -p scan
          unzip -q dist/*.zip -d scan
          echo "SCAN_ROOT=$(find scan -maxdepth 1 -mindepth 1 -type d)" >> "$GITHUB_ENV"

      # A scanner that walked nothing reports exactly what a clean codebase
      # reports. This has already happened once on this project: a whole-tree
      # Trivy run returned zero findings, reproducibly, while a split scan of
      # the same tree found real ones. Count the files first and fail loudly if
      # the corpus is empty, rather than reading silence as safety.
      - name: Refuse to scan an empty corpus
        run: |
          count=$(find "$SCAN_ROOT" -name '*.py' | wc -l)
          echo "python files to scan: $count"
          if [ "$count" -lt 20 ]; then
            echo "::error::only $count python files found; the package is wrong or unpacking failed"
            exit 1
          fi

      - name: Bandit
        run: |
          pip install --quiet --only-binary :all: bandit==1.9.4
          bandit --version
          bandit -r "$SCAN_ROOT" -f json -o bandit_raw.json --severity-level low || true
          python3 -c "
          import json
          d = json.load(open('bandit_raw.json'))
          m = d['metrics']['_totals']
          print('bandit: %d loc, high=%s medium=%s low=%s' % (
              m['loc'], m['SEVERITY.HIGH'], m['SEVERITY.MEDIUM'], m['SEVERITY.LOW']))
          assert m['loc'] > 0, 'bandit scanned zero lines'
          "

      # --config=auto resolves rules from Semgrep's registry over the network.
      # Pinned rulesets are used instead of auto so the set is stated rather
      # than negotiated, and so a registry change cannot alter a release scan.
      - name: Semgrep
        run: |
          pip install --quiet --only-binary :all: semgrep==1.175.0
          semgrep --version
          semgrep scan --config=p/python --config=p/secrets \
            --json --output=semgrep_raw.json --metrics=off "$SCAN_ROOT" || true
          python3 -c "
          import json
          d = json.load(open('semgrep_raw.json'))
          scanned = len(d.get('paths', {}).get('scanned', []))
          print('semgrep: %d files scanned, %d findings' % (scanned, len(d.get('results', []))))
          assert scanned > 0, 'semgrep scanned zero files'
          "

      # Pinned rather than tracking master. release.yml runs this with
      # contents: write, so whatever master points at that day would run
      # with permission to publish. A tag is also something Dependabot can
      # see; a branch is not.
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: scan
          format: json
          output: trivy_raw.json
          scanners: secret,misconfig,vuln
          exit-code: "0"

      # Redact before anything is uploaded. Scanners quote what they matched,
      # and an artifact is a second copy of that with none of the context that
      # explains why it was harmless.
      - name: Redact scan artifacts
        run: |
          python3 - <<'PY'
          import glob, re
          MARKER = re.compile(r"-*(?:BEGIN|END)\s+[A-Z ]*PRIVATE KEY-*[*]*")
          BLOB = re.compile(r"(?:[A-Za-z0-9+/]{60,}={0,2}\s*){2,}")
          for path in glob.glob("*_raw.json"):
              text = open(path).read()
              text = MARKER.sub("<<<Redacted: private key detected here>>>", text)
              text = BLOB.sub("<<<Redacted>>>", text)
              open(path, "w").write(text)
              print("redacted", path)
          PY
          grep -lE "BEGIN [A-Z ]*PRIVATE KEY" *_raw.json && exit 1 || echo "no key material in artifacts"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: scan-${{ github.sha }}
          path: |
            bandit_raw.json
            semgrep_raw.json
            trivy_raw.json
            dist/*.zip.sha256
