# The suite on every interpreter this project claims to support.
#
# The floor used to be a claim rather than a fact: nine documents promised 3.9
# while every workflow ran 3.11 or 3.12, and nothing anywhere proved 3.9 worked.
# It did not, on four tests. A supported version is one the suite runs on.
#
# The floor is 3.12 because everything below it is out of upstream security
# support. 3.9 ended in October 2025 and 3.10 ends in October 2026, so an
# enterprise or government deployment cannot take patches for either.
name: python matrix

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: suite on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # one version failing should not hide the others
      matrix:
        python: ["3.12", "3.13", "3.14.7"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      # Standard library only, so there is nothing to install and no network
      # call between checkout and the result.
      - name: Run the suite
        run: |
          python3 --version
          python3 -m unittest discover -s tests -q
