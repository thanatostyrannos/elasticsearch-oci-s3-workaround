# Semgrep against this repository's own Python, feeding the Code Scanning
# dashboard.
#
# The rulesets are named here rather than fetched from a Semgrep account or
# resolved by --config=auto, so the set that ran is readable from this file
# and a registry change cannot quietly alter a scan. No account and no token
# are needed. These are the same two rulesets security-scan.yml runs against
# the built archive; this one runs against the tree, because a Code Scanning
# alert has to point at a line in a file the repository actually has.
#
# tests/ and evidence/ are left out on purpose. tests/ holds synthetic
# credential-shaped fixtures that exist to be matched, and evidence/ holds
# captured tool output that quotes them. Scanning either fills the dashboard
# with findings about files nobody receives, and a dashboard that cries wolf
# stops being read.
name: Semgrep

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '29 4 * * 2'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read          # for actions/checkout
      security-events: write  # for upload-sarif to file Code Scanning alerts
      actions: read           # upload-sarif reads the run status
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          pip install --quiet --only-binary :all: semgrep==1.175.0
          semgrep --version

      # Two passes over the same rulesets, because the JSON report carries the
      # file count and the SARIF report does not. The count is what proves the
      # scan happened: a scanner that walked nothing reports exactly what a
      # clean codebase reports, and this project has already been burned once
      # by reading that silence as safety.
      - name: Scan, and count what was scanned
        run: |
          # A finding is an alert on the dashboard, not a broken build, so the
          # scanner's own exit code is discarded. Whether the scan really ran
          # is decided below by the file count, not by that exit code.
          semgrep scan --config=p/python --config=p/secrets \
            --json --output=semgrep.json --metrics=off \
            --exclude=tests --exclude=evidence . || true
          python3 - <<'PY'
          import json, sys
          d = json.load(open("semgrep.json"))
          scanned = len(d.get("paths", {}).get("scanned", []))
          findings = len(d.get("results", []))
          print("semgrep: %d files scanned, %d findings" % (scanned, findings))
          if scanned == 0:
              sys.exit("semgrep scanned zero files; this result proves nothing")
          PY

      - name: Produce SARIF for the dashboard
        run: |
          semgrep scan --config=p/python --config=p/secrets \
            --sarif --output=semgrep.sarif --metrics=off \
            --exclude=tests --exclude=evidence . || true

      - name: Upload SARIF file
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d  # v3.37.9
        with:
          sarif_file: semgrep.sarif
