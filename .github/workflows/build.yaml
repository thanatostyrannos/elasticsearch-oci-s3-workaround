name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege. SonarQube Cloud's starter snippet leaves this out, so the
# job inherits whatever the repository default is, which is write on many
# repositories. The scanner reads the tree and talks to SonarQube Cloud over
# its own token; it needs nothing from the GitHub API but the checkout.
permissions:
  contents: read
  pull-requests: write  # read to decorate, write to post the results comment

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # The quality gate asks for coverage on new code, and with no report
      # uploaded it reads zero and fails every pull request on a number nobody
      # measured. This measures it.
      #
      # tests/ and evidence/ are omitted: one is the tests themselves, the
      # other is captured output. The rig scripts read low here because the
      # suite drives them through subprocess, so the lines those runs exercise
      # are invisible to this. Worth fixing separately rather than papering
      # over: the number is honest about what it saw, not about what ran.
      - name: Measure coverage
        run: |
          pip install --quiet --only-binary :all: coverage==7.16.0
          # The suite drives the top-level scripts through subprocess. Without
          # this the children run unmeasured and those scripts report a
          # fraction of what the tests actually exercise. sitecustomize is
          # written to a scratch directory rather than the repository so it is
          # not importable during ordinary development.
          mkdir -p "$RUNNER_TEMP/covhook"
          printf 'import coverage\ncoverage.process_startup()\n' \
            > "$RUNNER_TEMP/covhook/sitecustomize.py"
          export COVERAGE_PROCESS_START="$PWD/.coveragerc"
          export PYTHONPATH="$RUNNER_TEMP/covhook:$PYTHONPATH"
          coverage run -m unittest discover -s tests -q
          coverage combine
          coverage xml -o coverage.xml
          coverage report | tail -5

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Everything below runs even when the gate fails, because a failed gate
      # is exactly when someone wants to read what it found.

      - name: Collect the scan results
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p sonar-export
          key=thanatostyrannos_elasticsearch-oci-s3-workaround
          scope=""
          [ -n "$PR" ] && scope="&pullRequest=$PR"
          curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=$key&ps=500&resolved=false$scope" \
            -o sonar-export/issues.json
          curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/measures/component?component=$key&metricKeys=security_rating,reliability_rating,sqale_rating,security_review_rating,coverage,bugs,vulnerabilities,code_smells,security_hotspots,ncloc,duplicated_lines_density$scope" \
            -o sonar-export/measures.json
          curl -sS -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$key$scope" \
            -o sonar-export/gate.json
          # Named by commit, because that is what you look one up by. The
          # digest proves it was not edited after the fact, so it goes beside
          # the file rather than into its name.
          for f in issues measures gate; do
            sha256sum "sonar-export/$f.json" > "sonar-export/$f.json.sha256"
          done
          python3 .github/render-scan-summary.py > sonar-export/summary.md
          cat sonar-export/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post the results on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One comment, edited in place. A new comment per push turns a busy
          # pull request into a wall of bot output nobody reads.
          marker="<!-- sonar-scan-results -->"
          body="$marker"$'\n'"$(cat sonar-export/summary.md)"
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq "[.[] | select(.body | startswith(\"$marker\"))] | .[0].id // empty")
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -f body="$body" >/dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              -f body="$body" >/dev/null
            echo "posted a new comment"
          fi

      - name: Keep the results with the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: sonar-findings-${{ github.sha }}
          path: sonar-export/
          retention-days: 90
