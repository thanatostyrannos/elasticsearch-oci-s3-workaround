name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege. SonarQube Cloud's starter snippet leaves this out, so the
# job inherits whatever the repository default is, which is write on many
# repositories. The scanner reads the tree and talks to SonarQube Cloud over
# its own token; it needs nothing from the GitHub API but the checkout.
permissions:
  contents: read
  pull-requests: read  # lets the analysis decorate a pull request

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
