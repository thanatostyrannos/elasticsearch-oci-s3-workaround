name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege. SonarQube Cloud's starter snippet leaves this out, so the
# job inherits whatever the repository default is, which is write on many
# repositories. The scanner reads the tree and talks to SonarQube Cloud over
# its own token; it needs nothing from the GitHub API but the checkout.
permissions:
  contents: read
  pull-requests: read  # lets the analysis decorate a pull request

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # The quality gate asks for coverage on new code, and with no report
      # uploaded it reads zero and fails every pull request on a number nobody
      # measured. This measures it.
      #
      # tests/ and evidence/ are omitted: one is the tests themselves, the
      # other is captured output. The rig scripts read low here because the
      # suite drives them through subprocess, so the lines those runs exercise
      # are invisible to this. Worth fixing separately rather than papering
      # over: the number is honest about what it saw, not about what ran.
      - name: Measure coverage
        run: |
          pip install --quiet --only-binary :all: coverage==7.16.0
          # The suite drives the top-level scripts through subprocess. Without
          # this the children run unmeasured and those scripts report a
          # fraction of what the tests actually exercise. sitecustomize is
          # written to a scratch directory rather than the repository so it is
          # not importable during ordinary development.
          mkdir -p "$RUNNER_TEMP/covhook"
          printf 'import coverage\ncoverage.process_startup()\n' \
            > "$RUNNER_TEMP/covhook/sitecustomize.py"
          export COVERAGE_PROCESS_START="$PWD/.coveragerc"
          export PYTHONPATH="$RUNNER_TEMP/covhook:$PYTHONPATH"
          coverage run -m unittest discover -s tests -q
          coverage combine
          coverage xml -o coverage.xml
          coverage report | tail -5

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
