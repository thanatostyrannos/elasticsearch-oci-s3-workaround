# Only the actions are watched, because only the actions have versions.
#
# The project imports the standard library and nothing else, verified by the
# test suite, so there is no manifest for pip to read and a pip entry would
# watch an empty set forever. The workflows in this directory pin third-party
# actions by tag and by commit id, and those do go stale.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # Always "/" for this ecosystem. Dependabot reads .github/workflows from
    # the repository root regardless of where the workflow files sit.
    directory: "/"
    schedule:
      interval: "weekly"
    # Small enough that a bad bump is easy to spot and revert.
    open-pull-requests-limit: 5
