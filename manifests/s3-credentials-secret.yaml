apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: es-rig
type: Opaque
stringData:
  s3.client.default.access_key: CHANGEME-access
  s3.client.default.secret_key: CHANGEME-secret
  # Oracle Customer Secret Key, for repositories registered with the `oci`
  # client. Only needed if you are testing against a real Oracle bucket; MinIO
  # alone needs just the two above. Create one under Identity, Users, your
  # user, Customer Secret Keys. Oracle shows the secret once, at creation.
  s3.client.oci.access_key: CHANGEME-oci-access
  s3.client.oci.secret_key: CHANGEME-oci-secret
