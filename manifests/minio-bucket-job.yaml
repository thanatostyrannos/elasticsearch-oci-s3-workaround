apiVersion: batch/v1
kind: Job
metadata:
  name: minio-make-bucket
  namespace: es-rig
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: minio-make-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-01-17T23-25-50Z
          command:
            - /bin/sh
            - -c
            - >
              mc alias set rig http://minio:9000 CHANGEME-access CHANGEME-secret &&
              mc mb -p rig/es-snapshots
