apiVersion: batch/v1
kind: Job
metadata:
  name: minio-make-bucket
  namespace: es-rig
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: minio-make-bucket
    spec:
      restartPolicy: OnFailure
      # This job only talks to MinIO over S3; it never calls the
      # Kubernetes API, so it does not need a service account token mounted.
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-01-17T23-25-50Z
          command:
            - /bin/sh
            - -c
            - >
              mc alias set rig http://minio:9000 CHANGEME-access CHANGEME-secret &&
              mc mb -p rig/es-snapshots
          env:
            # minio/mc runs as root by default and writes its alias config
            # to $HOME/.mc; point it at the emptyDir below instead of
            # relaxing readOnlyRootFilesystem.
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            runAsUser: 1000
            runAsGroup: 1000
          # One alias-set call and one bucket-create call, nothing else:
          # sized for a shell script that makes two HTTP requests and exits.
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
              ephemeral-storage: 32Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
