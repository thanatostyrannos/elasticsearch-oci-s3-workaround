# MinIO pinned to RELEASE.2025-01-18T00-31-37Z on purpose:
# this release rejects DeleteObjects requests without Content-MD5
# (same behavior as OCI Object Storage), which is the fault this rig reproduces.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: es-rig
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: es-rig
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      # The minio/minio image runs as root by default (no non-root user
      # baked in), so this pins it to a fixed non-root uid/gid instead.
      # fsGroup chowns the data PVC's group ownership so uid 1000 can write
      # to it; without it MinIO authenticates its own startup and then dies
      # unable to write its erasure-coding metadata.
      # This deployment only serves S3 API calls; it never calls the
      # Kubernetes API, so it does not need a service account token mounted.
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-01-18T00-31-37Z
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              value: CHANGEME-access
            - name: MINIO_ROOT_PASSWORD
              value: CHANGEME-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          # An object store that actually receives the rig's traffic (the
          # churn rig's snapshots and the leaked blobs the audit finds), so
          # it gets real headroom, unlike the one-shot mc job above. Object
          # data lands on the minio-data PVC; ephemeral-storage here only
          # bounds /tmp scratch.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 256Mi
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            # MinIO's Go runtime uses the OS temp dir for scratch files
            # outside the erasure-coded backend; with the root filesystem
            # read-only, that needs its own writable mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: es-rig
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
